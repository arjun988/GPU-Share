[workspace]
resolver = "2"
members = [
    "crates/gpumesh-common",
    "crates/gpumesh-security",
    "crates/gpumesh-protocol",
    "crates/gpumesh-storage",
    "crates/gpumesh-gpu",
    "crates/gpumesh-runtime",
    "crates/gpumesh-network",
    "crates/gpumesh-core",
    "crates/gpumesh-agent",
    "crates/gpumesh-cli",
]
default-members = ["crates/gpumesh-cli", "crates/gpumesh-agent"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["GPUMesh Contributors"]
repository = "https://github.com/gpumesh/gpumesh"

[workspace.dependencies]
gpumesh-common = { path = "crates/gpumesh-common" }
gpumesh-security = { path = "crates/gpumesh-security" }
gpumesh-protocol = { path = "crates/gpumesh-protocol" }
gpumesh-storage = { path = "crates/gpumesh-storage" }
gpumesh-gpu = { path = "crates/gpumesh-gpu" }
gpumesh-runtime = { path = "crates/gpumesh-runtime" }
gpumesh-network = { path = "crates/gpumesh-network" }
gpumesh-core = { path = "crates/gpumesh-core" }
gpumesh-agent = { path = "crates/gpumesh-agent" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
futures = "0.3"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env", "wrap_help", "string"] }
clap_complete = "4"
serde_yaml = "0.9"
owo-colors = "4"
indicatif = "0.17"
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
rand = "0.8"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
walkdir = "2"
ignore = "0.4"
async-trait = "0.1"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
rustls-pemfile = "2"
hostname = "0.4"
bytesize = "1"
tabled = "0.17"
nvml-wrapper = "0.10"
bollard = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
bincode = "1"
mdns-sd = "0.13"
local-ip-address = "0.6"